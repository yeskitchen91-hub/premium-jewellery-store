<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout Preview | HeerOra</title><meta name="description" content="Checkout preview for the HeerOra sample storefront. No order or payment is submitted."><meta property="og:title" content="Checkout Preview | HeerOra"><meta property="og:description" content="Review your demo order summary."><meta property="og:type" content="website"><link rel="icon" href="favicon/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"><script defer src="js/products.js"></script><script defer src="js/cart.js"></script><script defer src="js/wishlist.js"></script><script defer src="js/checkout.js"></script><script defer src="js/main.js"></script></head><body><div data-site-header></div><main><section class="page-head"><div class="container"><div class="breadcrumb">HeerOra / Checkout preview</div><h1>Checkout preview</h1><p>Payment, shipping and order handling are not configured. This form is a non-submitting demo.</p></div></section><section class="section"><div class="container checkout-layout"><form data-checkout-form><h2 style="font-family:var(--serif);font-weight:500">Delivery details preview</h2><div class="notice">Do not enter real personal information. The preview will not send or store your details.</div><div class="form-grid"><div class="form-field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required placeholder="Your name"></div><div class="form-field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel" pattern="[0-9 +()-]{8,16}" required placeholder="Phone number"></div><div class="form-field full"><label for="address">Address</label><textarea id="address" name="address" autocomplete="street-address" rows="3" required placeholder="Delivery address"></textarea></div><div class="form-field"><label for="city">City</label><input id="city" name="city" autocomplete="address-level2" required></div><div class="form-field"><label for="state">State</label><input id="state" name="state" autocomplete="address-level1" required></div><div class="form-field"><label for="pin">PIN code</label><input id="pin" name="pin" inputmode="numeric" pattern="[0-9]{6}" autocomplete="postal-code" required placeholder="6 digits"></div></div><button class="button" type="submit" style="margin-top:20px">Preview checkout</button></form><aside class="cart-summary"><h2 style="font-family:var(--serif);font-weight:500">Your sample order</h2><div data-checkout-items></div></aside></div></section></main><div data-site-footer></div></body></html>
